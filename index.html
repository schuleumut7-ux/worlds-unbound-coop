<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Worlds Unbound</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><div id="menu" class="screen"><div class="title"><div class="eyebrow">CO-OP ADVENTURE</div><h1>WORLDS<br><span>UNBOUND</span></h1><p>Explore. Fight. Discover. Together.</p></div><div class="panel"><input id="name" maxlength="16" placeholder="Your hero name" value="Hero"><div class="row"><button id="create">CREATE ROOM</button><button id="joinOpen">JOIN ROOM</button></div><button id="load">LOAD LOCAL HERO</button><small>Online co-op needs the Node.js server.</small></div></div><div id="join" class="screen hidden"><div class="panel"><h2>JOIN CO-OP</h2><input id="code" maxlength="5" placeholder="X7K4P" class="code"><button id="join">JOIN ROOM</button><button id="back">BACK</button></div></div><canvas id="game"></canvas><div id="hud" class="hidden"><div class="top"><div class="stat"><b id="hp">100</b> HP</div><div class="stat">⚡ <b id="stamina">100</b></div><div class="stat">⭐ Lv <b id="level">1</b></div><div class="stat">🪙 <b id="coins">50</b></div><div class="pill" id="roomLabel">OFFLINE</div></div><div class="quest"><b>QUEST</b><span id="quest">Reach the ancient portal</span></div><div class="boss hidden" id="boss"><div id="bossName">ANCIENT BEAST</div><div class="bar"><i id="bossBar"></i></div></div><div class="bottom"><button id="attack">⚔</button><button id="ability">✦</button><button id="dodge">➤</button><button id="interact">E</button><button id="inventory">🎒</button></div><div id="mobileJoy"><div id="joyKnob"></div></div><div id="toast"></div></div></div><script src="game.js"></script></body></html>
